menu:()=>`<div class="tabs">${CATS.map(c=>`<button class="${c==mc?"on":""}" onclick="mc='${c}';r()">${c}</button>`).join("")}</div><div class="bar"><span class="hint" style="margin:8px 0">Tap a price to change it. "Sold out" hides it from selling.</span><button class="p" onclick="addItem()">＋ Add item</button></div>${M.map((m,i)=>m.c==mc?`<div class="card row"><span><b>${m.n}</b> <small>${m.s}</small></span><span>${m.p.map((p,j)=>`<button class="s" onclick="ep(${i},${j})">${p[0]} ${p[1]}</button>`).join(" ")} <button class="s ${m.off?"p":""}" onclick="so(${i})">${m.off?"SOLD OUT":"Available"}</button></span></div>`:"").join("")}`,
stock:()=>`<div class="bar"><h2>📦 Stock</h2><button class="p" onclick="stAdd()">＋ New stock item</button></div>${S.stk.map((s,i)=>`<div class="card row"><span><b>${s.n}</b> ${s.q<=s.min?'<span class="bd r">LOW</span>':""}<br><small>${s.q} ${s.u} · alert below ${s.min}</small></span><span><button class="s gd" onclick="rst(${i})">＋ Restock</button> <button class="s" onclick="wst(${i})">🗑 Wastage</button> <button class="s" onclick="if(confirm('Remove?')){S.stk.splice(${i},1);save();r()}">✕</button></span></div>`).join("")||"<p>No stock yet. Add cheese, flour, chicken…</p>"}`,
waste:()=>`<div class="hint">Log wastage from the Stock page (🗑 Wastage button).</div>${S.ws.map(w=>`<div class="card row"><span>${new Date(w.t).toLocaleString()} · <b>${w.n}</b> · ${w.r}</span><b>${w.q} ${w.u}</b></div>`).join("")||"<p>No wastage logged.</p>"}`,
expn:()=>`<div class="bar"><h2>🧮 Expenses</h2><button class="p" onclick="exAdd()">＋ Add expense</button></div><div class="card row"><span>Today</span><b>${rs(ex(0))}</b></div><div class="card row"><span>Last 30 days</span><b>${rs(ex(30))}</b></div>${S.exp.slice(0,60).map(e=>`<div class="card row"><span>${new Date(e.t).toLocaleDateString()} · <b>${e.c}</b> ${e.n||""} <small>${e.by||""}</small></span><b>${rs(e.a)}</b></div>`).join("")}`,
offers:()=>`<div class="bar"><h2>🎁 Offers</h2><button class="p" onclick="ofAdd()">＋ New offer</button></div>${S.off.map((o,i)=>`<div class="card row"><b>${o.n} · ${o.pct}% off</b><button class="s" onclick="S.off.splice(${i},1);save();r()">✕</button></div>`).join("")||"<p>No offers yet. Staff can apply them in New order.</p>"}`,
log:()=>S.lg.slice(0,120).map(l=>`<div class="card row"><span>${new Date(l.t).toLocaleString()} · <b>${l.u}</b></span><span>${l.x}</span></div>`).join(""),
set:()=>`<div class="card"><h3>Settings</h3><button class="wide" onclick="mf('Service charge',[['v','Dine-in service charge %',S.svc]],v=>{S.svc=+v.v||0})">Service charge: ${S.svc}%</button><button class="wide" onclick="bk()">⬇ Download backup</button><label>⬆ Restore backup<input type="file" accept=".json" onchange="rsr(this)"></label></div><div class="card"><div class="bar"><h3>Staff & PINs</h3><button class="p" onclick="usAdd()">＋ Add staff</button></div>${S.users.map((u,i)=>`<div class="row"><span>${u.n} <small>${{o:"Owner",c:"Cashier",k:"Cook"}[u.r]}</small></span><span><button class="s" onclick="mf('Change PIN – ${u.n}',[['p','New PIN']],v=>{if(v.p.length<4)return false;u.pin=v.p;lg('PIN changed: ${u.n}')})">PIN</button> ${i?`<button class="s" onclick="S.users.splice(${i},1);save();r()">✕</button>`:""}</span></div>`).join("")}</div>`,
orders:()=>`<div class="hint">All orders today. Tap a button to print again.</div>${S.orders.filter(o=>day(o.t)==today()&&o.paid!=-1).reverse().map(o=>`<div class="card"><div class="row"><b>#${o.no} ${TY[o.type]}${o.tb?" · "+S.tables.find(t=>t.id==o.tb).name:""}</b><span>${o.paid?"✅ "+o.pm:"⏳ unpaid"} · ${rs(calc(o).total)}</span></div><small>${o.items.map(i=>i.q+"x "+i.n).join(", ")}</small><div class="row"><span><button class="s" onclick="show(S.orders.find(x=>x.id=='${o.id}'),'${o.paid?"f":"b"}')">🧾 Receipt</button> <button class="s" onclick="W=S.orders.find(x=>x.id=='${o.id}');W.kr=W.kr||1;show(W,'k');W=null">👨‍🍳 Kitchen slip</button></span></div></div>`).join("")||"<p>No orders yet today.</p>"}`,
kit:()=>`<div class="hint">Cooks: press the button when you start, and again when food is ready. Tickets turn yellow after 10 minutes and red after 20.</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${S.tk.filter(t=>t.st!="done").map(t=>{const m=(Date.now()-t.t)/6e4,w=t.type=="dine"?S.tables.find(x=>x.id==t.tb).name:TY[t.type];return`<div class="tk ${m>20?"rd":m>10?"a":""}"><div class="row"><b style="font-size:30px">#${t.no}</b><span>${w}<br>${Math.floor(m)} min</span></div>${t.items.map(i=>`<div style="font-size:16px"><b>${i.q}x</b> ${i.n}${i.tk?" 🥡":""}${i.nt?"<br>📝 "+i.nt:""}</div>`).join("")}<button class="p" style="width:100%;margin-top:8px" onclick="ks('${t.id}')">${t.st=="new"?"▶ Start cooking":t.st=="cook"?"✔ Ready":"Handed over"}</button></div>`}).join("")||"<p>No orders in the kitchen 🎉</p>"}</div>`,
uber:()=>`<div class="hint">When an Uber order comes in, go to <b>New Order → Uber</b>, type the Uber reference and the items. They show up here.</div><button class="p" onclick="pg='pos';r();start('uber')">＋ New Uber order</button>${S.orders.filter(o=>o.type=="uber"&&day(o.t)==today()).reverse().map(o=>{const L=["New","Preparing","Ready for rider","Picked up"];return`<div class="card"><div class="row"><b>#${o.no} · Uber ref ${o.ref}</b><span>${new Date(o.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div>${o.items.map(i=>`<div>${i.q}x ${i.n}${i.nt?" 📝"+i.nt:""}</div>`).join("")}<div class="row"><b>${rs(calc(o).total)}</b><span><button class="s" onclick="show(S.orders.find(x=>x.id=='${o.id}'),'k')">🖨 Slip</button> <button class="${o.us>2?"":"gd"}" onclick="U('${o.id}')">${L[o.us||0]} ${o.us>2?"✔":"→"}</button></span></div></div>`}).join("")}`,
cash:()=>{const T=S.orders.filter(o=>o.paid==1&&o.pm=="Cash"&&day(o.pt)==today()),cs=T.reduce((a,o)=>a+calc(o).total,0),mv=S.cash.filter(c=>day(c.t)==today()),mvs=mv.reduce((a,c)=>a+c.a,0);return`<div class="hint">Put money <b>in</b> or take money <b>out</b> of the drawer and always write the reason.</div><div class="card"><div class="row"><span>Opening cash (float)</span><b>${rs(S.open)} <button class="s" onclick="const v=prompt('Cash in drawer at start of day',S.open);if(v!==null){S.open=+v||0;save();r()}">edit</button></b></div><div class="row"><span>Cash sales today</span><b>${rs(cs)}</b></div><div class="row"><span>Money in / out</span><b>${rs(mvs)}</b></div><div class="row" style="font-size:20px"><b>Should be in drawer</b><b>${rs(S.open+cs+mvs)}</b></div></div><button class="p" onclick="cm(-1)">➖ Take money OUT</button> <button class="gd" onclick="cm(1)">➕ Put money IN</button><h3>Today's movements</h3>${mv.map(c=>`<div class="card row"><span>${new Date(c.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})} · <b>${c.a<0?"OUT":"IN"}</b> · ${c.r}</span><b>${rs(Math.abs(c.a))}</b></div>`).join("")||"<p>Nothing yet.</p>"}`}};
function ks(id){const t=S.tk.find(x=>x.id==id);t.st={new:"cook",cook:"ready",ready:"done"}[t.st];save();r()}
function U(id){const o=S.orders.find(x=>x.id==id);o.us=Math.min(3,(o.us||0)+1);save();r()}
function cm(s){const a=+prompt(s<0?"How much is taken OUT? (Rs.)":"How much is put IN? (Rs.)");if(!(a>0))return;const r2=prompt("Reason? (e.g. bought gas, staff advance, change)");if(!r2)return toast("A reason is needed");S.cash.push({t:Date.now(),a:a*s,r:r2});lg("Drawer "+(s<0?"OUT ":"IN ")+rs(a)+" "+r2);save();r()}
const NAV=[["dash","📊","Dashboard","o"],["tables","🪑","Tables","oc"],["pos","🧾","New order","oc"],["orders","📋","Orders","oc"],["kit","👨‍🍳","Kitchen","ock"],["uber","🛵","Uber orders","oc"],["cash","💰","Cash drawer","oc"],["cust","👥","Customers","oc"],["tok","📺","Token display","ock"],["rep","📈","Reports","o"],["menu","🍕","Menu","o"],["stock","📦","Stock & restock","oc"],["waste","🗑","Wastage","oc"],["expn","🧮","Expenses","oc"],["offers","🎁","Offers","o"],["log","🕵","Audit log","o"],["set","⚙","Staff & settings","o"]];
function r(){if(!me)return lgn();const ok=NAV.filter(n=>n[3].includes(me.r));if(!ok.some(n=>n[0]==pg))pg=ok[0][0];$("#nv").innerHTML=ok.map(([k,i,l])=>`<button class="nb ${pg==k?"on":""}" onclick="pg='${k}';r()"><i>${i}</i>${l}</button>`).join("");$("#us").innerHTML=`<b>${me.n}</b><small>${{o:"Owner",c:"Cashier",k:"Cook"}[me.r]}</small>${me.r!="k"?'<button class="p wide" onclick="closeDay()">🔒 Close day</button>':""}<button class="wide" onclick="out()">Log out</button>`;$("#m").innerHTML=PG[pg]();const n=S.tk.filter(t=>t.st=="new").length;if(n>nT&&pg=="kit")try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.3)}catch(e){}nT=n}
addEventListener("storage",e=>{if(e.key==K){S=JSON.parse(e.newValue);r()}});setInterval(()=>{if((pg=="kit"||pg=="tok")&&!$("#mo").style.display.includes("flex"))r()},30000);r();
