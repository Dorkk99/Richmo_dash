<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richmo Manager</title><link rel="icon" href="assets/logo.png">
<style>
:root{--bg:#14100d;--c:#211a15;--c2:#2b221b;--g:#e8b858;--e:#d9441f;--t:#f5efe4;--d:#a99c8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--c);border-bottom:2px solid var(--e);position:sticky;top:0;z-index:5}
header img{height:42px}header b{color:var(--g);font-size:18px}nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--c2);color:var(--t)}button:hover{filter:brightness(1.2)}
.p{background:var(--e)}.gd{background:var(--g);color:#000;font-weight:700}.on{background:var(--e)}.s{padding:5px 9px;font-size:13px}
main{padding:14px;max-width:1200px;margin:auto}.hint{background:#3a2f12;border-left:4px solid var(--g);padding:9px 12px;border-radius:8px;margin-bottom:12px;color:#f3dfa8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.tile{padding:18px 8px;text-align:center;font-weight:700;border:2px solid #3a2f26;background:var(--c)}
.T{height:96px;font-size:17px;color:#fff;border:2px solid #4a3d33;background:var(--c2)}.busy{background:#c62828;border-color:#ff8a80}.paid{background:#2e7d32;border-color:#a5d6a7}
.pos{display:grid;grid-template-columns:1fr 340px;gap:14px}@media(max-width:850px){.pos{grid-template-columns:1fr}}
.card{background:var(--c);border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 0}
.it{display:flex;justify-content:space-between;padding:12px;background:var(--c);border-radius:10px;cursor:pointer;margin-bottom:6px}.it:hover{background:var(--c2)}
h3{color:var(--g);margin:12px 0 6px}input,select{font:inherit;padding:9px;border-radius:8px;border:1px solid #4a3d33;background:#0e0b09;color:var(--t);width:100%}
#mo{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:center;justify-content:center;overflow:auto}#mo>div{background:var(--c);padding:18px;border-radius:14px;width:min(420px,94vw);max-height:92vh;overflow:auto}
.rc{background:#fff;color:#000;font:13px monospace;padding:10px;width:290px;margin:8px auto}.rc .n{font:900 56px sans-serif;text-align:center;line-height:1}.rc .c{text-align:center}.rc .r{display:flex;justify-content:space-between}.rc hr{border:0;border-top:1px dashed #000}.rc img{height:46px;filter:grayscale(1) contrast(2)}
.tk{border:3px solid #3a3;border-radius:12px;padding:10px;background:var(--c)}.tk.a{border-color:var(--g)}.tk.rd{border-color:#f44}
#ts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--g);color:#000;padding:10px 18px;border-radius:20px;display:none;z-index:20}
</style></head><body>
<header><img src="assets/logo.png" alt=""><b>Richmo Manager</b><nav id="nv"></nav></header><main id="m"></main><div id="mo"></div><div id="ts"></div>
<script>
// ---- MENU (from richmopizzeria.lk) : [category, group, sizes, "item price/price", name suffix]
const D=[
["Fried Rice","Keeri Samba","Small,Large,Family","Vegetable 600/1000/2400,Egg 750/1300/2850,Chicken 800/1400/3150,Sea Food 1000/1650/3550,Chicken Sea Food 1050/1750/3750,Pork 1300/2000/4500,Mix 1100/1850/3950,Mongoliyan 1250/1900/4050,Thai 1300/1900/4050,Nasi Gurang 1500/2000/4250,Richmo Special 1500/2100/4450,Pork With Mix 1700/2300/4900"," Rice"],
["Fried Rice","Basmathi","Small,Large,Family","Vegetable 700/1200/2650,Egg 950/1400/2050,Chicken 1000/1700/3650,Sea Food 1200/1900/4050,Chicken Sea Food 1300/2000/4250,Pork 1500/2300/4950,Mix 1400/2050/4450,Mongoliyan 1500/2150/4550,Thai 1500/2150/4550,Nasi Gurang 1600/2300/4850,Richmo Special 1700/2450/5100,Pork With Mix 1850/2600/5500"," Rice"],
["Rice & Curry","Lunch only","","Rice and Curry Chicken 500,Rice and Curry Fish 500,Yellow Rice Chicken 600,Yellow Rice Fish 600",""],
["Chopsey Rice","Keeri Samba","Large,Family","Egg 1900/-,Chicken 2500/4450,Sea Food 2800/4650,Mix 2950/4800"," Chopsey Rice"],
["Chopsey Rice","Basmathi","Large,Family","Egg 2200/-,Chicken 2850/4600,Sea Food 3000/4800,Mix 3300/5000"," Chopsey Rice"],
["Kottu","Kottu","Small,Large,Family","Egg 750/1000/2250,Chicken 900/1200/2650,Sea Food 950/1300/2850,Chicken Sea Food 1100/1500/3250,Pork 1500/1950/4100,Mix 1200/1700/3650,Pork With Mix 1700/2200/4800"," Kottu"],
["Kottu","Cheese Kottu","Small,Large","Egg 1100/1450,Chicken 1450/1750,Sea Food 1550/1850,Chicken Sea Food 1700/1900,Pork 1950/2500,Mix 1900/2200,Pork With Mix 2000/2800"," Cheese Kottu"],
["Kottu","Rice Kottu","Small,Large,Family","Egg 700/1100/2450,Chicken 900/1300/2850,Sea Food 1000/1500/3250,Chicken Sea Food 1150/1600/3450,Pork 1650/2050/4500,Mix 1250/1700/3650,Mongoliyan 1350/1800/3850,Thai 1400/1950/4150,Pork With Mix 1800/2350/5100"," Rice Kottu"],
["Pizza","Cheese & Veg","Medium,Large","Margarita Pizza 1300/1500,Cheese with Onion 1400/1700,Cheese with Mushroom 1400/1700,Veggie Masala 1500/1800,Jambo Sausage 1500/1900,Kochchi Sausage 1600/1950",""],
["Pizza","Chicken & Seafood","Medium,Large","Devilled Chicken 1700/2200,BBQ Chicken 1700/2200,Kochchi Chicken 1700/2200,Sri Lankan Chicken 1700/2200,Chicken Pepperoni 1700/2200,Mexican Chicken 1750/2250,Texas BBQ Chicken 1750/2250,Thandoori Chicken 1700/2200,Sea Food Supreme 1700/2300,Tuna Classic 1700/2300",""],
["Pizza","Pork & Richmo Special","Medium,Large","Devilled Pork 2000/2500,Kochchi Pork 2000/2500,Pepper Pork 2200/2700,Pizza Hawaiian 2000/2600,Pizza Tropical 2100/2700,Double Cheese & Tomato 2100/2700,Cheese Bacon 2200/3200,Big Blaster 2600/3650,Ultimate Meat with Nai Kochchi 2800/3950",""],
["Pasta","Pasta","","Creamy Cheese 1500,Creamy Cheese Chicken 1500,Spicy Chicken Cheese 1600,Creamy Chicken & Sausage 1700,Creamy Chicken & Bacon 1800,Spicy Creamy Prawns 1800"," Pasta"],
["Burger & Sub","Burger","","Crispy Chicken 950,Devilled Chicken 950,Kochchi Chicken 950"," Burger"],
["Burger & Sub","Submarine","","Crispy Chicken 1200,Devilled Chicken 1200,Kochchi Chicken 1200"," Submarine"],
["Veg & Starters","Vegetable","","Vegetable Chopsey 950,Hot Butter Mushroom 900,Mix Vegetable Salad 950,Mixed Vegetable Salad with Chicken 1250,Soup of the Day 300",""],
["Veg & Starters","Appetizer","","Garlic Bread 700,Cheesy Garlic Bread 1000,French Fries 980",""],
["Spaghetti","Spaghetti","","Creamy Cheese 950,Creamy Sausage 1050,Creamy Kochchi Sausage 1050,Creamy Chicken Cheese 1200,Creamy Cheese Bacon 1450,Chilli Garlic Chicken 1100,Chilli Garlic Prawns 1200,Spicy Chicken 1050,Spicy Creamy Chicken 1250,Spicy Creamy Prawns 1300,Spicy Prawns 1400,Spicy Creamy Sea Food 1450"," Spaghetti"],
["Noodles","Noodles","Small,Large,Family","Egg 950/1500/3250,Chicken 1000/1650/3550,Sea Food 1150/1800/3850,Chicken Sea Food 1200/1900/4050,Pork 1550/2100/4650,Mix 1250/1900/4050,Mongoliyan 1350/2050/4350,Thai 1350/2050/4350,Nasi Gurang 1450/2150/4550,Richmo Special 1500/2350/4950,Pork With Mix 1800/2500/5200"," Noodles"],
["Mee Goreng","Mee Goreng","Small,Large,Family","Egg 1050/1600/3450,Chicken 1100/1800/3650,Sea Food 1250/1950/4150,Chicken Sea Food 1300/2050/4350,Pork 1550/2350/4900,Mix 1350/2100/4450,Pork With Mix 1650/2400/5100"," Mee Goreng"],
["Bites","Omelette","","Sri Lankan 450,Chicken 550,Cheese 600,Cheese Chicken 700"," Omelette"],
["Bites","Chicken / Fish (300g)","","Fried Chicken 1450,Devilled Chicken 1500,Garlic Chicken 1650,Fried Fish 1600,Devilled Fish 1750,Garlic Fish 1950",""],
["Bites","Prawns / Pork / Cuttlefish (300g)","","Fried Prawns 1550,Devilled Prawns 1600,Garlic Prawns 1700,Fried Pork 2100,Devilled Pork 2300,Garlic Pork 2500,Hot Butter Cuttlefish 2200,Fried Cuttlefish 2000",""],
["Beverages","Mojito","","Lime 400,Ginger Lime 450,Watermelon 450,Apple 450,Pineapple 450,Green Mint 450,Blue Lagoon 500,Blackcurrant 500,Orange 500,Passion Fruit 530"," Mojito"],
["Beverages","Juice & Shakes","","Watermelon Juice 400,Mango Juice 430,Pineapple Juice 450,Vanilla Milkshake 530,Chocolate Milkshake 530,Strawberry Milkshake 530,Mango Milkshake 530",""],
["Beverages","Drinks","","Saruwath 300,Lemon Ice Tea 500,Strawberry Ice Tea 500,Ice Coffee 500,Ice Milo 500,Faluda 550,Black Tea With Ginger 80,Black Coffee (Nescafe) 100,Hot Milo 480,Hot Chocolate 480",""],
["Dessert","Dessert","","Biscuit Pudding 150,Bread Pudding With Ice Cream 250,Ice Cream 380,Watalappan With Ice Cream 380",""]];
const M=[];D.forEach(([c,s,z,x,f])=>{const L=z?z.split(","):[];x.split(",").forEach(i=>{const k=i.lastIndexOf(" "),p=i.slice(k+1).split("/");M.push({c,s,n:i.slice(0,k)+f,p:z?L.map((l,j)=>[l,+p[j]]).filter(a=>a[1]>0):[["",+p[0]]]})})});
const CATS=[...new Set(M.map(m=>m.c))];
// ---- STATE
const K="richmo_v1",$=s=>document.querySelector(s),rs=n=>"Rs. "+Math.round(n).toLocaleString("en-US"),uid=()=>Math.random().toString(36).slice(2,9);
let S=JSON.parse(localStorage.getItem(K)||"null")||{svc:10,seq:0,open:0,tables:[...Array(12)].map((_,i)=>({id:uid(),name:"Table "+(i+1),st:"free"})),orders:[],tk:[],cash:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
let pg="tables",W=null,cat=CATS[0],nT=0;
const day=t=>new Date(t-4*36e5).toDateString(),today=()=>day(Date.now());
const calc=o=>{const sub=o.items.reduce((a,i)=>a+i.p*i.q,0),base=o.items.reduce((a,i)=>a+(i.tk?0:i.p*i.q),0),svc=o.type=="dine"?Math.round(base*S.svc/100):0;return{sub,svc,total:sub+svc}};
const toast=t=>{const e=$("#ts");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2500)};
const mo=h=>{const e=$("#mo");e.innerHTML="<div>"+h+"</div>";e.style.display="flex"},cl=()=>$("#mo").style.display="none";
const TY={dine:"🍽 Dine-in",take:"🥡 Takeaway",uber:"🛵 Uber"};
// ---- RECEIPTS (k=kitchen, b=demo bill, f=final)
function rc(o,k){const c=calc(o),d=new Date(o.t).toLocaleString(),w=(o.tb?S.tables.find(t=>t.id==o.tb).name:"");
const hd=`<div class="c"><img src="assets/wordmark.png"><br><b>${k=="k"?"KITCHEN ORDER":k=="b"?"BILL (NOT PAID)":"RICHMO PIZZERIA"}</b></div><div class="n">#${o.no}</div><div class="c b"><b>${TY[o.type]}${w?" · "+w:""}${o.ref?" · Ref "+o.ref:""}</b></div><div class="c">${d}${o.cust?"<br>"+o.cust:""}</div><hr>`;
if(k=="k")return hd+o.items.filter(i=>!i.s||i.k==o.kr).map(i=>`<div style="font-size:17px"><b>${i.q} x</b> ${i.n}${i.tk?" 🥡TAKE AWAY":""}${i.nt?"<br>&nbsp;&nbsp;<i>** "+i.nt+"</i>":""}</div>`).join("")+"<hr>";
return hd+o.items.map(i=>`<div class="r"><span>${i.q} x ${i.n}${i.tk?" (TA)":""}</span><span>${Math.round(i.p*i.q)}</span></div>`).join("")+`<hr><div class="r"><span>Subtotal</span><span>${rs(c.sub)}</span></div>${c.svc?`<div class="r"><span>Service charge ${S.svc}%</span><span>${rs(c.svc)}</span></div>`:""}<div class="r" style="font-size:17px"><b>TOTAL</b><b>${rs(c.total)}</b></div><hr>`+(k=="b"?`<div class="c">Payment: Cash / Card ______<br>Please pay at the counter</div>`:`<div class="r"><span>Paid by</span><span>${o.pm}</span></div>${o.pm=="Cash"?`<div class="r"><span>Cash given</span><span>${rs(o.rec)}</span></div><div class="r"><span>Change</span><span>${rs(o.rec-c.total)}</span></div>`:""}`)+`<hr><div class="c">Thank you! Come again 🔥</div>`}
function show(o,k){mo(`<div class="rc" id="rc">${rc(o,k)}</div><div class="row"><button class="p" onclick="pr()">🖨 Print</button><button onclick="cl()">Close</button></div>`)}
function pr(){const f=document.createElement("iframe");f.style.cssText="position:fixed;width:0;height:0;border:0";document.body.appendChild(f);const d=f.contentWindow.document;d.open();d.write(`<style>@page{size:80mm auto;margin:3mm}body{font:13px monospace;width:74mm;margin:0}.n{font:900 56px sans-serif;text-align:center}.c{text-align:center}.r{display:flex;justify-content:space-between}hr{border:0;border-top:1px dashed #000}img{height:46px;filter:grayscale(1) contrast(2)}</style>`+$("#rc").innerHTML);d.close();setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print()},300)}
// ---- ORDER ACTIONS
function mk(type,tb){S.seq++;const t=Date.now(),n=S.orders.filter(o=>day(o.t)==day(t)).length+1;return{id:uid(),no:n,type,tb,items:[],t,paid:0,cust:"",ref:""}}
function tc(id){const t=S.tables.find(x=>x.id==id);
if(t.st=="free"){if(!confirm("Check in guests at "+t.name+"?"))return;const o=mk("dine",id);S.orders.push(o);t.st="busy";t.oid=o.id;save();W=o;pg="pos";return r()}
const o=S.orders.find(x=>x.id==t.oid);
mo(`<h3>${t.name} · Order #${o.no}</h3><div class="card">${o.items.map(i=>`${i.q} x ${i.n}`).join("<br>")||"No items yet"}<hr>${rs(calc(o).total)}</div>`+(t.st=="busy"?`<button class="p" style="width:100%;margin:4px 0" onclick="W=S.orders.find(x=>x.id=='${o.id}');pg='pos';cl();r()">➕ Add / change items</button><button style="width:100%;margin:4px 0" onclick="show(S.orders.find(x=>x.id=='${o.id}'),'b')">🧾 Demo bill (no payment)</button><button class="gd" style="width:100%;margin:4px 0" onclick="payDlg('${o.id}')">💳 Customer paid</button>`:`<button style="width:100%;margin:4px 0" onclick="show(S.orders.find(x=>x.id=='${o.id}'),'f')">🧾 Receipt again</button>`)+`<button style="width:100%;margin:4px 0" onclick="clr('${id}')">⬜ ${t.st=="paid"?"Customers left – make table free":"Set table back to free (cancel)"}</button><button style="width:100%" onclick="cl()">Close</button>`)}
function clr(id){const t=S.tables.find(x=>x.id==id),o=S.orders.find(x=>x.id==t.oid);if(t.st=="busy"&&o&&!o.paid){if(o.items.length&&!confirm("This table has unpaid items. Cancel them?"))return;o.cx=1;o.paid=-1}t.st="free";delete t.oid;save();cl();r()}
function pick(i){const m=M[i];m.p.length==1?add(i,0):mo(`<h3>${m.n}</h3>${m.p.map((p,j)=>`<button class="p" style="width:100%;margin:5px 0;padding:16px" onclick="add(${i},${j});cl()">${p[0]} — ${rs(p[1])}</button>`).join("")}<button style="width:100%" onclick="cl()">Cancel</button>`)}
function add(i,j){if(!W)return toast("Pick Dine-in table, Takeaway or Uber first");const m=M[i],n=m.n+(m.p[j][0]?" ("+m.p[j][0]+")":""),x=W.items.find(a=>a.n==n&&!a.s&&!a.tk);x?x.q++:W.items.push({n,p:m.p[j][1],q:1});if(W.paid)W.paid=0;r()}
function qty(i,d){const x=W.items[i];if(x.s&&d<0)return toast("Already sent to kitchen – tell the cook");x.q+=d;if(x.q<1)W.items.splice(i,1);r()}
const tg=i=>{W.items[i].tk=!W.items[i].tk;r()},nt=i=>{const v=prompt("Note for kitchen (e.g. no onions)",W.items[i].nt||"");if(v!==null){W.items[i].nt=v;r()}};
function start(type){W=mk(type);if(type=="dine"){mo(`<h3>Choose a table</h3><div class="grid">${S.tables.map(t=>`<button class="T ${t.st}" onclick="cl();tc('${t.id}')">${t.name}</button>`).join("")}</div>`);W=null}else{if(type=="uber"){const v=prompt("Uber order reference number");if(v===null){W=null;return}W.ref=v}else W.cust=prompt("Customer name (optional)")||"";r()}}
function send(){if(!W||!W.items.length)return toast("Add some items first");const nw=W.items.filter(i=>!i.s);if(!S.orders.includes(W))S.orders.push(W);
if(nw.length){W.kr=(W.kr||0)+1;nw.forEach(i=>{i.s=1;i.k=W.kr});S.tk.push({id:uid(),oid:W.id,no:W.no,type:W.type,tb:W.tb,t:Date.now(),st:"new",items:nw.map(i=>({...i}))});}
if(W.type=="uber"&&!W.paid){W.paid=1;W.pm="Uber";W.us=W.us||0;W.pt=Date.now()}
save();const o=W;if(o.type!="dine")W=null;else W=null;pg=o.type=="uber"?"uber":o.type=="dine"?"tables":"pos";r();show(o,"k")}
function payDlg(id){const o=S.orders.find(x=>x.id==id||x==id),c=calc(o);W=o;mo(`<h3>Order #${o.no} — ${rs(c.total)}</h3><button class="gd" style="width:100%;margin:5px 0;padding:14px" onclick="paid('Cash')">💵 Cash</button><label>Cash given<input id="cg" type="number" value="${c.total}" oninput="$('#ch').textContent=rs(this.value-${c.total})"></label><p>Change: <b id="ch">Rs. 0</b></p><button class="gd" style="width:100%;margin:5px 0;padding:14px" onclick="paid('Card')">💳 Card</button><button style="width:100%" onclick="cl()">Cancel</button>`)}
function paid(m){const o=W,c=calc(o);if(m=="Cash"&&+$("#cg").value<c.total)return toast("Cash given is less than the total");o.paid=1;o.pm=m;o.rec=m=="Cash"?+$("#cg").value:c.total;o.pt=Date.now();if(!S.orders.includes(o))S.orders.push(o);if(o.items.some(i=>!i.s)){}const t=S.tables.find(x=>x.id==o.tb);if(t)t.st="paid";save();W=null;r();show(o,"f")}
// ---- PAGES
const PG={
tables:()=>`<div class="hint">Tap a <b>grey</b> table to check guests in (it turns <b style="color:#ff8a80">red</b>). When they pay it turns <b style="color:#a5d6a7">green</b>. When they leave, tap it and press "make table free".</div><div class="grid">${S.tables.map(t=>`<button class="T ${t.st}" onclick="tc('${t.id}')">${t.name}<br><small>${t.st=="free"?"Free":t.st=="busy"?"Eating · #"+S.orders.find(o=>o.id==t.oid).no:"Paid ✔"}</small></button>`).join("")}</div><br><button onclick="S.tables.push({id:uid(),name:'Table '+(S.tables.length+1),st:'free'});save();r()">＋ Add table</button> <button onclick="S.tables.length>1&&S.tables.every((t,i)=>i<S.tables.length-1||t.st=='free')&&(S.tables.pop(),save(),r())">－ Remove last table</button>`,
pos:()=>{const c=W?calc(W):{sub:0,svc:0,total:0};return`<div class="pos"><div>${W?"":`<div class="hint">Start here: choose how the customer is ordering.</div><div class="grid"><button class="tile p" onclick="start('dine')">🍽 Dine-in</button><button class="tile p" onclick="start('take')">🥡 Takeaway</button><button class="tile p" onclick="start('uber')">🛵 Uber order</button></div>`}<h3>1. Pick a category</h3><div class="grid">${CATS.map(x=>`<button class="tile ${x==cat?"on":""}" onclick="cat='${x}';r()">${x}</button>`).join("")}</div>${[...new Set(M.filter(m=>m.c==cat).map(m=>m.s))].map(s=>`<h3>${s}</h3>`+M.map((m,i)=>m.c==cat&&m.s==s?`<div class="it" onclick="pick(${i})"><span>${m.n}</span><b>${m.p.length>1?"from ":""}${rs(m.p[0][1])}</b></div>`:"").join("")).join("")}</div>
<div class="card" style="position:sticky;top:64px;align-self:start"><h3 style="margin-top:0">${W?TY[W.type]+" · #"+W.no+(W.tb?" · "+S.tables.find(t=>t.id==W.tb).name:""):"No order started"}</h3>${W?W.items.map((i,x)=>`<div class="card" style="background:var(--c2)"><div class="row"><span>${i.n}${i.s?" ✅":""}</span><b>${rs(i.p*i.q)}</b></div><div class="row"><span><button class="s" onclick="qty(${x},-1)">−</button> <b>${i.q}</b> <button class="s" onclick="qty(${x},1)">＋</button></span><span>${W.type=="dine"?`<button class="s ${i.tk?"gd":""}" onclick="tg(${x})" title="No service charge">🥡</button> `:""}<button class="s" onclick="nt(${x})">📝</button></span></div>${i.nt?"<small>📝 "+i.nt+"</small>":""}</div>`).join("")||"<p>Tap items on the left.</p>":""}
<hr><div class="row"><span>Subtotal</span><span>${rs(c.sub)}</span></div>${W&&W.type=="dine"?`<div class="row"><span>Service ${S.svc}%</span><span>${rs(c.svc)}</span></div>`:""}<div class="row"><b>TOTAL</b><b style="font-size:20px">${rs(c.total)}</b></div>${W?`<button class="p" style="width:100%;margin:4px 0;padding:14px" onclick="send()">👨‍🍳 Send to kitchen${W.type=="uber"?" & save":""}</button>${W.type!="uber"?`<button style="width:100%;margin:4px 0" onclick="W.items.length?show(W,'b'):toast('Add items first')">🧾 Demo bill</button><button class="gd" style="width:100%;margin:4px 0" onclick="W.items.length?payDlg(W):toast('Add items first')">💳 Pay now</button>`:""}<button style="width:100%" onclick="if(W&&!S.orders.includes(W)||confirm('Close this screen? Saved items stay on the table.')){W=null;r()}">✖ Close</button>`:""}${W&&W.type=="dine"?`<p><small>🥡 button = this item is takeaway (no service charge)</small></p>`:""}</div></div>`},
orders:()=>`<div class="hint">All orders today. Tap a button to print again.</div>${S.orders.filter(o=>day(o.t)==today()&&o.paid!=-1).reverse().map(o=>`<div class="card"><div class="row"><b>#${o.no} ${TY[o.type]}${o.tb?" · "+S.tables.find(t=>t.id==o.tb).name:""}</b><span>${o.paid?"✅ "+o.pm:"⏳ unpaid"} · ${rs(calc(o).total)}</span></div><small>${o.items.map(i=>i.q+"x "+i.n).join(", ")}</small><div class="row"><span><button class="s" onclick="show(S.orders.find(x=>x.id=='${o.id}'),'${o.paid?"f":"b"}')">🧾 Receipt</button> <button class="s" onclick="W=S.orders.find(x=>x.id=='${o.id}');W.kr=W.kr||1;show(W,'k');W=null">👨‍🍳 Kitchen slip</button></span></div></div>`).join("")||"<p>No orders yet today.</p>"}`,
kit:()=>`<div class="hint">Cooks: press the button when you start, and again when food is ready. Tickets turn yellow after 10 minutes and red after 20.</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${S.tk.filter(t=>t.st!="done").map(t=>{const m=(Date.now()-t.t)/6e4,w=t.type=="dine"?S.tables.find(x=>x.id==t.tb).name:TY[t.type];return`<div class="tk ${m>20?"rd":m>10?"a":""}"><div class="row"><b style="font-size:30px">#${t.no}</b><span>${w}<br>${Math.floor(m)} min</span></div>${t.items.map(i=>`<div style="font-size:16px"><b>${i.q}x</b> ${i.n}${i.tk?" 🥡":""}${i.nt?"<br>📝 "+i.nt:""}</div>`).join("")}<button class="p" style="width:100%;margin-top:8px" onclick="ks('${t.id}')">${t.st=="new"?"▶ Start cooking":t.st=="cook"?"✔ Ready":"Handed over"}</button></div>`}).join("")||"<p>No orders in the kitchen 🎉</p>"}</div>`,
uber:()=>`<div class="hint">When an Uber order comes in, go to <b>New Order → Uber</b>, type the Uber reference and the items. They show up here.</div><button class="p" onclick="pg='pos';r();start('uber')">＋ New Uber order</button>${S.orders.filter(o=>o.type=="uber"&&day(o.t)==today()).reverse().map(o=>{const L=["New","Preparing","Ready for rider","Picked up"];return`<div class="card"><div class="row"><b>#${o.no} · Uber ref ${o.ref}</b><span>${new Date(o.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div>${o.items.map(i=>`<div>${i.q}x ${i.n}${i.nt?" 📝"+i.nt:""}</div>`).join("")}<div class="row"><b>${rs(calc(o).total)}</b><span><button class="s" onclick="show(S.orders.find(x=>x.id=='${o.id}'),'k')">🖨 Slip</button> <button class="${o.us>2?"":"gd"}" onclick="U('${o.id}')">${L[o.us||0]} ${o.us>2?"✔":"→"}</button></span></div></div>`}).join("")}`,
cash:()=>{const T=S.orders.filter(o=>o.paid==1&&o.pm=="Cash"&&day(o.pt)==today()),cs=T.reduce((a,o)=>a+calc(o).total,0),mv=S.cash.filter(c=>day(c.t)==today()),mvs=mv.reduce((a,c)=>a+c.a,0);return`<div class="hint">Put money <b>in</b> or take money <b>out</b> of the drawer and always write the reason.</div><div class="card"><div class="row"><span>Opening cash (float)</span><b>${rs(S.open)} <button class="s" onclick="const v=prompt('Cash in drawer at start of day',S.open);if(v!==null){S.open=+v||0;save();r()}">edit</button></b></div><div class="row"><span>Cash sales today</span><b>${rs(cs)}</b></div><div class="row"><span>Money in / out</span><b>${rs(mvs)}</b></div><div class="row" style="font-size:20px"><b>Should be in drawer</b><b>${rs(S.open+cs+mvs)}</b></div></div><button class="p" onclick="cm(-1)">➖ Take money OUT</button> <button class="gd" onclick="cm(1)">➕ Put money IN</button><h3>Today's movements</h3>${mv.map(c=>`<div class="card row"><span>${new Date(c.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})} · <b>${c.a<0?"OUT":"IN"}</b> · ${c.r}</span><b>${rs(Math.abs(c.a))}</b></div>`).join("")||"<p>Nothing yet.</p>"}`}};
function ks(id){const t=S.tk.find(x=>x.id==id);t.st={new:"cook",cook:"ready",ready:"done"}[t.st];save();r()}
function U(id){const o=S.orders.find(x=>x.id==id);o.us=Math.min(3,(o.us||0)+1);save();r()}
function cm(s){const a=+prompt(s<0?"How much is taken OUT? (Rs.)":"How much is put IN? (Rs.)");if(!(a>0))return;const r2=prompt("Reason? (e.g. bought gas, staff advance, change)");if(!r2)return toast("A reason is needed");S.cash.push({t:Date.now(),a:a*s,r:r2});save();r()}
function r(){$("#nv").innerHTML=[["tables","🪑 Tables"],["pos","🧾 New Order"],["kit","👨‍🍳 Kitchen"],["uber","🛵 Uber"],["orders","📋 Orders"],["cash","💰 Cash Drawer"]].map(([k,l])=>`<button class="${pg==k?"on":""}" onclick="pg='${k}';r()">${l}</button>`).join("")+`<button onclick="const v=prompt('Dine-in service charge %',S.svc);if(v!==null){S.svc=+v||0;save();r()}">⚙ Service ${S.svc}%</button>`;$("#m").innerHTML=PG[pg]();const n=S.tk.filter(t=>t.st=="new").length;if(n>nT&&pg=="kit")try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.start();o.stop(a.currentTime+.3)}catch(e){}nT=n}
addEventListener("storage",e=>{if(e.key==K){S=JSON.parse(e.newValue);r()}});setInterval(()=>{if(pg=="kit"&&!$("#mo").style.display.includes("flex"))r()},30000);r();
</script></body></html>
